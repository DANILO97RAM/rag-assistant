services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    restart: unless-stopped
    networks:
      - rag-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    user: "1000:1000"
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/workspace  # Montar código del proyecto para MCP
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - PYTHONPATH=/workspace/src  # Path para imports Python
      - CHROMA_HOST=chromadb  # Hostname del contenedor ChromaDB
      - CHROMA_PORT=8000
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - chromadb

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_data:
  n8n_data:
